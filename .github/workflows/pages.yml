name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Cache
        uses: actions/cache@v5
        with:
          path: app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Install app dependencies
        run: cd app && pnpm install --frozen-lockfile
      - name: Audit app dependencies
        run: cd app && pnpm audit --audit-level=high
      - name: Typecheck app
        run: cd app && pnpm typecheck
      - name: Test app
        run: cd app && pnpm test:coverage
      - name: Lint app
        run: cd app && pnpm lint
      - name: Check app formatting
        run: cd app && pnpm format:check
      - name: Build and embed production app
        run: ./build.sh frontend
      - name: Test Go server and CLI
        run: cd api && go test -race ./...
      - name: Build standalone binaries
        run: |
          mkdir -p build
          BUILD_VERSION=$(cat VERSION)
          cd api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${BUILD_VERSION}" -o ../build/server-status-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${BUILD_VERSION}" -o ../build/server-status-linux-arm64 .
      - name: Build public demo
        run: cd app && VITE_FAKE_API=true pnpm build
      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./app/dist
      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: server-status-binaries
          path: ./build/server-status-linux-*

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
